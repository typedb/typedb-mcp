version: '3.8'

services:
  typedb:
    image: typedb/typedb:3.7.2
    container_name: typedb
    ports:
      - "127.0.0.1:1729:1729"
      - "127.0.0.1:8000:8000"
    networks:
      - typedb-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  typedb-mcp:
    image: typedb/typedb-mcp:1.0.1
    platform: linux/amd64
    container_name: typedb-mcp
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      typedb:
        condition: service_healthy
    command: 
      - "--typedb-address"
      - "http://typedb:8000"
      - "--typedb-username"
      - "admin"
      - "--typedb-password"
      - "password"
    networks:
      - typedb-network

networks:
  typedb-network:
    driver: bridge
